<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22405e">
<title>Cuaderno de aula</title>
<style>
:root{--pa:#fbfaf7;--gr:#e4e8ef;--ink:#1e2a38;--so:#5c6b7c;--fa:#93a0ae;--ru:#d8dee7;--rd:#d5453f;--am:#f2c230;--pk:#e4577e;--az:#3d89cc;--ve:#56b25f;--ac:#22405e;--ok:#2e8b5e;--la:#c88a16}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--pa);font-size:16px;line-height:1.45;padding-bottom:70px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
.w{max-width:640px;margin:0 auto;padding:0 14px}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--pa);border-bottom:1px solid var(--ru);padding-top:env(safe-area-inset-top)}
h1{font-size:16px;font-weight:650;margin:0;padding:11px 0 7px 12px;border-left:2px solid var(--rd)}
nav{display:flex}
nav button{flex:1;background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 1px 11px;font-size:12.5px;color:var(--so)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
h2{font-size:22px;font-weight:640;margin:16px 0 6px}
h3{font-size:15.5px;font-weight:640;margin:0 0 8px}
.mb{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px}
.ar{width:38px;height:38px;border:1px solid var(--ru);border-radius:50%;background:#fff;font-size:17px}
.dw,.gd{display:grid;grid-template-columns:repeat(7,1fr)}
.dw div{text-align:center;font-size:12px;color:var(--fa);font-weight:600}
.dw div.on{color:var(--ink)}
.gd{gap:2px}
.cl{aspect-ratio:1;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cl.em{visibility:hidden}
.nu{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:15.5px;font-weight:520}
.we .nu{color:var(--pk)}.of .nu{color:var(--fa);font-weight:400}
.cd .nu{background:#fff;box-shadow:inset 0 0 0 1px var(--ru);font-weight:650}
.m-inicio .nu{background:var(--am);color:#3b2c00;font-weight:700;box-shadow:none}
.m-fin .nu{background:var(--pk);color:#fff;font-weight:700;box-shadow:none}
.m-festivo .nu{background:var(--az);color:#fff;font-weight:700;box-shadow:none}
.m-libre .nu{background:var(--ve);color:#fff;font-weight:700;box-shadow:none}
.td .nu{box-shadow:0 0 0 2.5px var(--ink)}
.dt{display:flex;gap:3px;height:5px}
.dt i{width:5px;height:5px;border-radius:50%}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 0;padding-top:12px;border-top:1px solid var(--ru)}
.lg span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--so)}
.lg i{width:13px;height:13px;border-radius:4px}
.st{display:flex;border:1px solid var(--ru);border-radius:10px;background:#fff;overflow:hidden;margin-top:12px}
.st div{flex:1;padding:11px 6px;text-align:center;border-right:1px solid var(--ru)}
.st div:last-child{border:0}
.st b{display:block;font-size:20px;font-weight:650}
.st small{font-size:11.5px;color:var(--fa);display:block;line-height:1.2}
.bar{display:flex;gap:8px;align-items:center;margin:16px 0 8px}
.bar input[type=date]{flex:1;min-width:0;border:1px solid var(--ru);border-radius:9px;padding:9px 10px;background:#fff}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tg span{font-size:12px;padding:3px 9px;border-radius:20px;background:#fff;border:1px solid var(--ru);color:var(--so)}
.tg span.k{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:#fff;border:1px solid var(--ru);border-radius:10px;padding:14px;margin-bottom:12px}
.lb{font-size:12.5px;color:var(--fa);font-weight:600;margin:12px 0 6px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ch button{border:1px solid var(--ru);background:#fff;border-radius:20px;padding:5px 11px;font-size:13px;color:var(--so)}
.ch button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:560}
.ch button.ok{border-color:var(--ok);color:var(--ok)}
textarea{width:100%;min-height:90px;border:1px solid var(--ru);border-radius:10px;padding:11px;background:#fff;resize:vertical}
.rw{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.b{border:1px solid var(--ru);background:#fff;border-radius:10px;padding:10px 12px;font-weight:580;font-size:14px;text-align:center}
.b.g{flex:1}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
.b.r{background:var(--pk);border-color:var(--pk);color:#fff}
.b.d{color:var(--rd);border-color:#f0c9c7}
.hi{font-size:12.5px;color:var(--fa);margin:8px 0 0;line-height:1.5}
.sr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--gr)}
.sr .n{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.mk{display:flex;gap:3px}
.mk button{width:33px;height:33px;padding:0;border:1px solid var(--ru);border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:var(--fa)}
.mk button.P{background:var(--ok);border-color:var(--ok);color:#fff}
.mk button.R{background:var(--la);border-color:var(--la);color:#fff}
.mk button.F{background:var(--rd);border-color:var(--rd);color:#fff}
.mk button.J{background:var(--fa);border-color:var(--fa);color:#fff}
.en{position:relative;background:#fff;border:1px solid var(--ru);border-radius:10px;padding:10px 32px 10px 14px;margin-bottom:8px;overflow:hidden}
.en i.bl{position:absolute;left:0;top:0;bottom:0;width:4px}
.en .h{font-size:12px;color:var(--fa);margin-bottom:3px}
.en .t{font-size:15px;white-space:pre-wrap}
.en .x{position:absolute;top:4px;right:4px;background:none;border:0;color:var(--fa);font-size:17px;padding:4px 8px}
.dh{font-size:14px;font-weight:650;margin:16px 0 6px}
.al{font-size:13px;color:var(--so);background:#fff;border:1px solid var(--ru);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.ir{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.ir input{flex:1;min-width:0;border:1px solid var(--ru);border-radius:8px;padding:9px 10px;background:#fff}
.ir .x{background:none;border:0;color:var(--fa);font-size:18px;padding:2px 6px}
.wd{display:flex;gap:4px;flex-wrap:wrap}
.wd button{width:40px;height:40px;border:1px solid var(--ru);border-radius:9px;background:#fff;font-weight:650;color:var(--fa)}
.wd button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.su{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gr)}
.su .n{flex:1;min-width:0;font-size:14.5px}
.su small{display:block;font-size:12px;color:var(--fa)}
.su b{font-size:17px;font-weight:650}
.tk{height:7px;border-radius:4px;background:var(--gr);overflow:hidden}
.tk i{display:block;height:100%;background:var(--ok)}
.tk i.b{background:var(--rd)}.tk i.p{background:var(--la)}
.ep{color:var(--fa);font-size:14px;padding:10px 0;line-height:1.5}
.ri{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--gr);font-size:13.5px}
.ri i{width:11px;height:11px;border-radius:3px;flex:none}
.ri span{flex:1;min-width:0}
.ri small{display:block;color:var(--fa);font-size:12px}
.hd{display:flex;gap:8px;font-size:11.5px;color:var(--fa);font-weight:600;padding-bottom:4px}
.hd .n{flex:1}
.hd i{width:60px;flex:none;text-align:center;font-style:normal}
.hd b{width:50px;flex:none;text-align:right;font-weight:600}
.gg{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--gr)}
.gg .n{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.gg input{width:60px;flex:none;border:1px solid var(--ru);border-radius:8px;padding:8px 4px;text-align:center;background:#fff}
.gg .r{width:50px;flex:none;text-align:right;font-weight:650}
.av{border-bottom:1px solid var(--gr);padding:12px 0}
.av .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.av .t b{font-size:15px;font-weight:600}
